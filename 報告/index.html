:root{--bg:#f8f4ec;--panel:#ffffff;--panel2:#f3ede2;--ink:#2c2620;--mut:#8a7f72;--gold:#b8943a;--goldD:#8a6d1f;--line:#e5dccb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85}
.top{position:sticky;top:0;background:rgba(248,244,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 22px;display:flex;align-items:center;gap:14px;z-index:5}
.top a{color:var(--goldD);text-decoration:none;font-size:13px}
.top b{font-family:"Noto Serif TC",serif;color:var(--ink);font-size:16px;letter-spacing:.06em}
.wrap{max-width:820px;margin:0 auto;padding:30px 24px 80px}
h1{font-family:"Noto Serif TC",serif;font-size:24px;color:var(--ink);margin:26px 0 14px;letter-spacing:.05em}
h2{font-family:"Noto Serif TC",serif;font-size:18px;color:var(--goldD);margin:30px 0 12px;padding-left:12px;border-left:3px solid var(--gold)}
h3{font-size:15px;color:var(--ink);margin:20px 0 8px;font-weight:700}
p{margin:8px 0;font-size:14.5px}
ul{margin:8px 0 14px 4px;list-style:none}
li{font-size:14px;margin:7px 0;padding-left:18px;position:relative}
li::before{content:"◆";position:absolute;left:0;color:var(--gold);font-size:9px;top:6px}
strong,b{color:var(--goldD);font-weight:700}
a{color:var(--goldD)}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th{background:var(--panel2);color:var(--goldD);text-align:left;padding:9px 12px;font-weight:500;letter-spacing:.05em}
td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
code{background:var(--panel2);border-radius:4px;padding:1px 6px;font-size:12.5px;color:var(--goldD)}
hr{border:none;height:1px;background:var(--line);margin:22px 0}
blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--mut);margin:10px 0}
.arch a{display:inline-block;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 14px;margin:4px 6px 4px 0;font-size:13px;text-decoration:none}
.arch a:hover{border-color:var(--gold)}
